<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Дайджест — Нейросети для новичков</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="hero">
    <div class="hero-glow"></div>
    <div class="hero-content">
        <span class="hero-badge">AI Digest</span>
        <h1>Нейросети <span class="gradient-text">с нуля</span></h1>
        <p class="hero-sub">10 карточек, которые превратят тебя из новичка в человека, который понимает AI</p>
        <div class="hero-stats">
            <div class="stat"><span class="stat-num">10</span><span class="stat-label">статей</span></div>
            <div class="stat"><span class="stat-num">0</span><span class="stat-label">знаний</span></div>
            <div class="stat-arrow">&rarr;</div>
            <div class="stat"><span class="stat-num">100</span><span class="stat-label">% понимания</span></div>
        </div>
    </div>
</header>

<main class="container">
    <div class="cards-grid">
        {% for card in cards %}
        <article class="card" style="--accent: {{ card.color }}" data-id="{{ card.id }}">
            <div class="card-header">
                <span class="card-icon">{{ card.icon }}</span>
                <span class="card-tag" style="background: {{ card.color }}20; color: {{ card.color }}">{{ card.tag }}</span>
            </div>
            <h2 class="card-title">{{ card.title }}</h2>
            <p class="card-desc">{{ card.description }}</p>
            <button class="card-btn" onclick="openCard({{ card.id }})">
                Открыть материал
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </article>
        {% endfor %}
    </div>
</main>

<!-- Модальное окно -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-tag" id="modalTag"></div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<footer class="footer">
    <p>Built with Flask &bull; AI Digest 2025</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
